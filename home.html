<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Exam Seating System</title>
    <link rel="stylesheet" href="home.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="home-container">
        <div class="home-box">
            <div class="home-header">
                <h1>🎓</h1>
                <h2>Exam Seating System</h2>
                <p style="color: #718096; font-size: 1.05em; margin-top: 12px; font-weight: 500;">Admin Dashboard Access</p>
            </div>
            
            <!-- Google Sign-In -->
            <div class="google-signin-section">
                <div class="signin-label">
                    <span>🔐 Sign in with Google</span>
                </div>
                <div id="g_id_onload"
                     data-client_id="80284631535-bf0igbecrqsfgsbkiqe77plh0jtuhdok.apps.googleusercontent.com"
                     data-callback="handleGoogleLogin">
                </div>
                <div class="google-button-wrapper">
                    <div class="g_id_signin" 
                         data-type="standard"
                         data-size="large"
                         data-theme="filled_blue"
                         data-text="signin_with"
                         data-shape="pill"
                         data-logo_alignment="left">
                    </div>
                </div>
            </div>
            
            <div id="errorMsg"></div>
            
            <div class="info-box">
                <p>
                    <strong>ℹ️ Note:</strong> Only authorized admin accounts can access the dashboard. 
                    Students can search their seats without login.
                </p>
            </div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config-simple.js"></script>
    <script src="login.js"></script>
</body>
</html>
