<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Exam Seat Arrangement System</title>
    <link rel="stylesheet" href="home.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="home-container">
        <div class="home-box">
            <div class="home-header">
                <h1>🎓</h1>
                <h2>Exam Seat Arrangement System</h2>
            </div>
            
            <!-- Student Search Section -->
            <div style="margin: 30px 0; padding: 20px; background: #f0f9ff; border-radius: 12px; border: 2px solid #3b82f6;">
                <h3 style="margin: 0 0 15px 0; color: #1e40af; font-size: 18px;">👨‍🎓 Student Portal</h3>
                <p style="margin: 0 0 15px 0; color: #1e40af; font-size: 14px;">Enter your roll number to view your seat details</p>
                <input type="text" id="studentRollNo" placeholder="Enter Roll Number (e.g., 25wh1a0501)" 
                       style="width: 100%; padding: 12px; border: 2px solid #3b82f6; border-radius: 8px; font-size: 16px; margin-bottom: 10px;">
                <button onclick="searchStudent()" style="width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;">
                    🔍 Search My Seat
                </button>
            </div>
            
            <div style="text-align: center; margin: 20px 0; color: #6b7280; font-weight: 600;">OR</div>
            
            <!-- Admin Login Section -->
            <div style="margin: 20px 0;">
                <p style="text-align: center; color: #4b5563; margin-bottom: 15px; font-size: 14px;">Admin? Sign in with Google</p>
                <div id="g_id_onload"
                     data-client_id="80284631535-bf0igbecrqsfgsbkiqe77plh0jtuhdok.apps.googleusercontent.com"
                     data-callback="handleGoogleLogin">
                </div>
                <div class="g_id_signin" 
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="sign_in_with"
                     data-shape="rectangular"
                     data-logo_alignment="left"
                     style="display: flex; justify-content: center;">
                </div>
            </div>
            
            <div id="errorMsg" style="display: none; margin-top: 15px; padding: 10px; background: #fff5f5; color: #e53e3e; border-radius: 8px; text-align: center;"></div>
        </div>
    </div>
    
    <script>
        function searchStudent() {
            const rollNo = document.getElementById('studentRollNo').value.trim().toLowerCase();
            if (!rollNo) {
                alert('⚠️ Please enter your roll number');
                return;
            }
            window.location.href = `student.html?roll=${rollNo}`;
        }
        
        // Allow Enter key to search
        document.getElementById('studentRollNo')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchStudent();
            }
        });
    </script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config-simple.js"></script>
    <script src="login.js"></script>
</body>
</html>
