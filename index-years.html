<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Seat Arrangement System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin-bottom: 0;">🎓 Exam Seat Arrangement System</h1>
            <button onclick="logout()" style="background: #dc3545; padding: 10px 20px; font-size: 14px;">🚪 Logout</button>
        </div>
        
        <div class="input-section">
            <div class="form-group">
                <label>📅 Select Semester (Common for all years):</label>
                <div style="display: flex; gap: 20px; margin: 15px 0; padding: 20px; background: #e3f2fd; border-radius: 8px;">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 18px; font-weight: 600;">
                        <input type="radio" name="semester" value="I" onchange="selectCommonSemester('I')" style="width: 20px; height: 20px; cursor: pointer;">
                        <span>Semester I</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 18px; font-weight: 600;">
                        <input type="radio" name="semester" value="II" onchange="selectCommonSemester('II')" style="width: 20px; height: 20px; cursor: pointer;">
                        <span>Semester II</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group" id="yearSelectionSection" style="display: none;">
                <label>📚 Select Year:</label>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button type="button" class="year-btn" data-year="1" onclick="selectYear(1)">1st Year</button>
                    <button type="button" class="year-btn" data-year="2" onclick="selectYear(2)">2nd Year</button>
                    <button type="button" class="year-btn" data-year="3" onclick="selectYear(3)">3rd Year</button>
                    <button type="button" class="year-btn" data-year="4" onclick="selectYear(4)">4th Year</button>
                </div>
            </div>
            
            <div id="yearBranchSelection"></div>
            
            <div class="form-group" id="examDetailsSection" style="display: none;">
                <label>📅 Exam Date:</label>
                <input type="date" id="examDate" required style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;">
                <div id="displayDate" style="margin-top: 5px; color: #4a90e2; font-weight: 600;"></div>
            </div>
            
            <div class="form-group" id="examTimeSection" style="display: none;">
                <label>🕐 Exam Time:</label>
                <input type="time" id="examTime" required style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;">
            </div>
            
            <div style="text-align: center; margin-top: 30px;" id="generateSection" style="display: none;">
                <button onclick="generateArrangement()" style="background: #4a90e2; padding: 15px 40px; font-size: 18px;">✨ Generate Arrangement</button>
            </div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config-simple.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="app-years.js"></script>
    <script>
        if (!sessionStorage.getItem('isLoggedIn') || sessionStorage.getItem('userRole') !== 'admin') {
            window.location.href = 'home.html';
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
