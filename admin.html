<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Seat Arrangement System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 200px; background: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { margin: 0 0 30px 0; font-size: 18px; }
        .sidebar-btn { padding: 12px; margin: 8px 0; background: #34495e; border: none; color: white; border-radius: 6px; cursor: pointer; text-align: left; font-size: 14px; }
        .sidebar-btn:hover { background: #4a5f7f; }
        .sidebar-btn.logout { background: #dc3545; margin-top: auto; }
        .main-area { flex: 1; overflow-y: auto; }
        #allTablesView { display: none; padding: 30px; }
        #adminContent { display: none; width: 100%; }
    </style>
</head>
<body>
    <div id="adminContent">
        <div class="sidebar">
            <h2>🎓 Admin Panel</h2>
            <button class="sidebar-btn" onclick="showView('tables')">📋 All Tables</button>
            <button class="sidebar-btn logout" onclick="logout()">🚪 Logout</button>
        </div>
        
        <div class="main-area">
            <div id="generateView">
                <div class="container">
                    <h1 style="margin-bottom: 20px;">🎓 Generate Seating Arrangement</h1>
        
        <div class="input-section">
            <div class="form-group">
                <label>📅 Select Year:</label>
                <div class="branch-count-buttons">
                    <button type="button" class="count-btn" onclick="selectYear('1st Year')">1st Year</button>
                    <button type="button" class="count-btn" onclick="selectYear('2nd Year')">2nd Year</button>
                    <button type="button" class="count-btn" onclick="selectYear('3rd Year')">3rd Year</button>
                    <button type="button" class="count-btn" onclick="selectYear('4th Year')">4th Year</button>
                </div>
            </div>
            
            <div class="form-group" id="midSelectionSection" style="display: none;">
                <label>📝 Select Exam Type:</label>
                <div class="branch-count-buttons">
                    <button type="button" class="count-btn" onclick="selectMid('Mid 1')">Mid 1</button>
                    <button type="button" class="count-btn" onclick="selectMid('Mid 2')">Mid 2</button>
                    <button type="button" class="count-btn" onclick="selectMid('Sem')">Sem</button>
                </div>
            </div>

            <div class="form-group">
                <label>📚 How many branches are having the exam?</label>
                <div class="branch-count-buttons">
                    <button type="button" class="count-btn" onclick="selectBranchCount(1)">1</button>
                    <button type="button" class="count-btn" onclick="selectBranchCount(2)">2</button>
                    <button type="button" class="count-btn" onclick="selectBranchCount(3)">3</button>
                    <button type="button" class="count-btn" onclick="selectBranchCount(4)">4</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>🎯 Select Branches:</label>
                <div class="branch-buttons">
                    <button type="button" class="branch-btn" data-branch="CSE" onclick="toggleBranch('CSE')">💻 CSE</button>
                    <button type="button" class="branch-btn" data-branch="ECE" onclick="toggleBranch('ECE')">📡 ECE</button>
                    <button type="button" class="branch-btn" data-branch="AIML" onclick="toggleBranch('AIML')">🤖 AIML</button>
                    <button type="button" class="branch-btn" data-branch="EEE" onclick="toggleBranch('EEE')">⚡ EEE</button>
                </div>
            </div>
            
            <div id="subjectSelection"></div>
            
            <div class="form-group" id="examDetailsSection" style="display: none;">
                <label>📅 Exam Date:</label>
                <input type="date" id="examDate" required style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;">
                <div id="displayDate" style="margin-top: 5px; color: #4a90e2; font-weight: 600;"></div>
            </div>
            
            <div class="form-group" id="examTimeSection" style="display: none;">
                <label>🕐 Exam Time:</label>
                <input type="time" id="examTime" required style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;">
            </div>
            
            <div id="generateButtonSection" style="text-align: center; margin-top: 20px; display: none;">
                <button onclick="generateArrangement(false)" style="background: #4a90e2;">✨ Generate Arrangement</button>
            </div>
            </div>
        </div>
                </div>
            </div>
            
            <div id="allTablesView">
                <h1>📋 All Tables</h1>
                <div id="tablesContainer" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config-simple.js"></script>
    <script src="rollnumbers.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="app.js"></script>
    <script>
        if (!sessionStorage.getItem('isLoggedIn') || sessionStorage.getItem('userRole') !== 'admin') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('adminContent').style.display = 'flex';
        }
        
        function showView(view) {
            if (view === 'tables') {
                document.getElementById('generateView').style.display = 'none';
                document.getElementById('allTablesView').style.display = 'block';
                loadAllTables();
            } else {
                document.getElementById('generateView').style.display = 'block';
                document.getElementById('allTablesView').style.display = 'none';
            }
        }
        
        function logout() {
            if (window.isSavingData) {
                alert('⏳ Data is currently being saved. Please wait...');
                return;
            }
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
