<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student - Search Your Seat</title>
    <link rel="stylesheet" href="student.css">
</head>
<body>
    <div class="student-container">
        <div class="student-box">
            <button class="back-btn" onclick="logout()">🚪 Logout</button>
            
            <div class="student-header">
                <h1>🔍</h1>
                <h2>Search Your Seating</h2>
                <p>Enter the last 4 digits of your roll number</p>
            </div>
            
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="e.g., 0501 or 05a1" maxlength="4">
                <button onclick="searchSeat()">Search</button>
            </div>
            
            <div id="resultSection" class="result-section" style="display: none;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="result-card">
                        <h3>📋 Exam Details</h3>
                        <div class="result-info">
                            <div class="info-row">
                                <span class="label">Subject:</span>
                                <span class="value" id="subject"></span>
                            </div>
                            <div class="info-row">
                                <span class="label">Date:</span>
                                <span class="value" id="examDate"></span>
                            </div>
                            <div class="info-row">
                                <span class="label">Time:</span>
                                <span class="value" id="examTime"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="result-card">
                        <h3>🪑 Seating Details</h3>
                        <div class="result-info">
                            <div class="info-row">
                                <span class="label">Classroom:</span>
                                <span class="value" id="classroom"></span>
                            </div>
                            <div class="info-row">
                                <span class="label">Column:</span>
                                <span class="value" id="column"></span>
                            </div>
                            <div class="info-row">
                                <span class="label">Row:</span>
                                <span class="value" id="row"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config-simple.js"></script>
    <script src="student.js"></script>
    <script>
        if (!sessionStorage.getItem('isLoggedIn') || sessionStorage.getItem('userRole') !== 'student') {
            window.location.href = 'home.html';
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
