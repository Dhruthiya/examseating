<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student - Your Seat Details</title>
    <link rel="stylesheet" href="student.css">
</head>
<body>
    <div class="student-container">
        <div class="student-box">
            <button class="back-btn" onclick="logout()">🚪 Logout</button>
            
            <div class="student-header">
                <h1>🪑</h1>
                <h2>Your Seating Details</h2>
            </div>
            
            <div id="resultSection" class="result-section">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="result-card">
                        <h3>📋 Exam Details</h3>
                        <div class="result-info">
                            <div class="info-row">
                                <span class="label">Subject:</span>
                                <span class="value" id="subject"></span>
                            </div>
                            <div class="info-row">
                                <span class="label">Date:</span>
                                <span class="value" id="examDate"></span>
                            </div>
                            <div class="info-row">
                                <span class="label">Time:</span>
                                <span class="value" id="examTime"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="result-card">
                        <h3>🪑 Seating Details</h3>
                        <div class="result-info">
                            <div class="info-row">
                                <span class="label">Classroom:</span>
                                <span class="value" id="classroom"></span>
                            </div>
                            <div class="info-row">
                                <span class="label">Column:</span>
                                <span class="value" id="column"></span>
                            </div>
                            <div class="info-row">
                                <span class="label">Row:</span>
                                <span class="value" id="row"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const studentData = JSON.parse(sessionStorage.getItem('studentData') || '{}');
        
        if (!studentData.rollNumber) {
            alert('Please login first');
            window.location.href = 'home.html';
        } else {
            const bench = studentData.bench;
            const column = Math.ceil(bench / 8);
            const row = ((bench - 1) % 8) + 1;
            
            document.getElementById('subject').textContent = studentData.subject || 'N/A';
            document.getElementById('examDate').textContent = studentData.examDate || 'N/A';
            document.getElementById('examTime').textContent = studentData.examTime || 'N/A';
            document.getElementById('classroom').textContent = studentData.classroom || 'N/A';
            document.getElementById('column').textContent = column;
            document.getElementById('row').textContent = row;
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
