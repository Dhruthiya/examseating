<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Seat Arrangement System</title>
    <link rel="stylesheet" href="styles-v2.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Exam Seat Arrangement System</h1>
            <button onclick="logout()" class="logout-btn">🚪 Logout</button>
        </div>
        
        <div class="input-section">
            <div class="form-group">
                <label>🎯 Select Branches:</label>
                <div class="branch-buttons">
                    <button type="button" class="branch-btn" data-branch="CSE" onclick="toggleBranch('CSE')">💻 CSE</button>
                    <button type="button" class="branch-btn" data-branch="ECE" onclick="toggleBranch('ECE')">📡 ECE</button>
                    <button type="button" class="branch-btn" data-branch="AIML" onclick="toggleBranch('AIML')">🤖 AIML</button>
                    <button type="button" class="branch-btn" data-branch="EEE" onclick="toggleBranch('EEE')">⚡ EEE</button>
                </div>
            </div>
            
            <div id="subjectSelection"></div>
            
            <div class="form-group" id="examDetailsSection" style="display: none;">
                <label>📅 Exam Date:</label>
                <input type="date" id="examDate" required>
            </div>
            
            <div class="form-group" id="examTimeSection" style="display: none;">
                <label>🕐 Exam Time:</label>
                <input type="time" id="examTime" required>
            </div>
            
            <div class="action-buttons">
                <button onclick="generateArrangement()" class="generate-btn">✨ Generate Arrangement</button>
            </div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config-simple.js"></script>
    <script src="app-v2.js"></script>
    <script>
        if (!sessionStorage.getItem('isLoggedIn') || sessionStorage.getItem('userRole') !== 'admin') {
            window.location.href = 'home.html';
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
