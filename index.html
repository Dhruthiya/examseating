<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam Seat Arrangement</title>    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Exam Seat Arrangement System</h1>
        
        <div class="input-section">
            <div class="form-group">
                <label>Number of Classrooms:</label>
                <input type="number" id="classrooms" min="1" value="1">
            </div>
            
            <div class="form-group">
                <label>Student Data (Roll No, Name, Class, Branch):</label>
                <textarea id="studentData" rows="10" placeholder="101, John Doe, CSE-A, CSE&#10;102, Jane Smith, ECE-A, ECE&#10;103, Bob Johnson, CSE-B, CSE"></textarea>
            </div>
            
            <div class="form-group">
                <label>Or Upload CSV:</label>
                <input type="file" id="csvFile" accept=".csv">
            </div>
            
            <button onclick="generateArrangement()">Generate Arrangement</button>
        </div>
        
        <div id="output" class="output-section" style="display:none;">
            <h2>Seating Arrangement</h2>
            <div class="download-buttons">
                <button onclick="downloadPDF()">Download PDF</button>
                <button onclick="downloadExcel()">Download Excel</button>
            </div>
            <div id="tableContainer"></div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
